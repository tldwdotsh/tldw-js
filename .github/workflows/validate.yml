name: Validate JavaScript client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.11.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 plugin/scripts/validate.py --allow-placeholder-endpoint
      - run: python3 -m unittest discover -s plugin/examples/grok/tests -v
      - run: npm ci --offline --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
