# Merge into your Grok Build config; never replace an existing configuration.
# Native Grok expands these placeholders when loading the server.
[mcp_servers.tldw]
url = "${TLDW_MCP_URL:-https://api.tldw.invalid/mcp}"
headers = { Authorization = "Bearer ${TLDW_API_TOKEN}" }
startup_timeout_sec = 30
tool_timeout_sec = 60
